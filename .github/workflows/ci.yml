name: CI

on:
  pull_request:
  # PUSH TRIGGER ADDED 13 Aug 2026. This workflow was `pull_request`-only, which meant every one
  # of the five steps below - type check, build, redirect-sync, Lighthouse and prose lint - was
  # ABSENT on any commit that reached `main` directly. This repo is trunk-based and pushes to main
  # routinely, so that is not an edge case, it is the normal path.
  #
  # Demonstrated rather than argued: the three commits pushed on 13 Aug (adb03be, 65ff82a,
  # 2870306) have ZERO runs of this workflow between them, and 2870306 changed `global.css` and
  # auto-deployed to production. `gh run list --commit <sha>` returns nothing for all three, while
  # health.yml (which does carry a push trigger) ran on the same push. The gate was not failing,
  # it was not running, and a green board was being read as though it had.
  #
  # Bot health commits carry `[skip ci]`, so the `chore(health)` traffic does not spend runner
  # minutes here. Deliberately NOT filtered by `paths`: a path filter is the same class of bug as
  # the missing trigger, a gate that silently does not run, and it is what "docs-only" changes
  # said right before they shipped a CSS regression.
  push:
    branches: [main]

# Touches nothing in package.json: Lighthouse CI runs via npx, pulling a pinned version
# on demand rather than becoming a project dependency.
jobs:
  quality-gates:
    name: Lighthouse + prose lint
    runs-on: ubuntu-latest
    steps:
      # v5 on both. The v4 tags run on Node 20, which is being removed from runners, and this
      # workflow was emitting a deprecation warning on every PR.
      #
      # fetch-depth: 0 ADDED 16 Aug 2026, and it is load-bearing rather than tidiness. The default
      # is a SHALLOW clone (depth 1), and `check-pipeline` section 4 - the check the system-health
      # step below exists to bring forward - decides whether a page is newer than its Stage 7
      # artefact with `git log -1 --format=%ct -- <file>` per file. On a depth-1 clone that returns
      # empty for every file the tip commit did not touch, so the comparison degrades to "no data,
      # nothing to report" and the check passes by knowing nothing. That is the precise failure
      # this workflow has now hit twice by other routes (the missing push trigger, the lhci
      # `_comment_tbt` key): a gate that is green because it is not looking.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      # Type-checks .astro frontmatter and inline scripts. The script has existed since
      # Wave 0 but was never wired into CI, so TypeScript errors could ship - six were
      # sitting in main when this step was added (five in SiteHeader's nav controller,
      # one widened prop literal in the styleguide), all fixed in the same commit.
      # Runs before the build so a type error fails fast rather than after Lighthouse.
      - name: Type check
        run: npm run check

      # `npm run build` carries the redirect hooks and, since 15 Aug 2026, three postbuild checks
      # over the finished dist/: `check-redirect-targets` (every internal redirect target resolves),
      # `check-links` (every same-origin link resolves; reports, never fails) and `check-meta` (no
      # page both noindex and in the sitemap, canonical form, and the title/description ratchet).
      # `check-meta` DOES fail the build, and the defect it was written for was live: two CPD bundle
      # pages shipped `noindex,nofollow` while listed in sitemap-0.xml.
      - run: npm run build

      # public/_redirects is generated, so a hand-edit or a stale commit would silently
      # ship a redirect map that does not match its source of truth. prebuild has just
      # rewritten it from the CSV; if that changed anything, the committed copy was wrong.
      - name: Redirect artifact is in sync with redirects.csv
        run: git diff --exit-code -- public/_redirects

      # ADDED 15 Aug 2026. Until now, NOTHING that reads a regulatory claim could block a merge.
      # check-claims (page figures reconciled against kb/register/, the retired White Card unit
      # code, the no-bare-"ABE" rule, SYSTEM.md §5's script list) and check-positions (no page
      # contradicting the online-delivery policy, no nav entry claiming RTO status) ran only inside
      # system-health, which runs post-merge in health.yml and is deliberately non-blocking. So a
      # figure contradicting the register was recorded AFTER it was on main and auto-deployed.
      #
      # --strict is what makes these gates rather than reports, and it escalates FAILs only: both
      # scripts exit 1 on `fails.length && STRICT` and ignore warnings entirely. That distinction is
      # why this is safe to add today - check-claims currently prints 24 warnings, every one of them
      # the same shape ("this figure is not in kb/register/") on ABE's own commercial prices rather
      # than on a government fact, and none of them would redden this gate. Verified before wiring,
      # in both directions: with a deliberate FAIL present the strict run exits 1 and the plain run
      # still exits 0.
      #
      # The figures themselves are deliberately not quoted here. kb/mistakes-log.md row 7 - a price
      # written into a comment and later scanned as a live page figure, seen five times - bars
      # exactly that, and its stated surface is everything in the repo a scanner reads. The first
      # draft of this comment quoted one, which would have been the sixth sighting, in the same
      # change that incremented the row to five.
      - name: Regulatory claims and positions
        run: |
          node scripts/check-claims.mjs --strict
          node scripts/check-positions.mjs --strict

      # ADDED 16 Aug 2026. Until now nothing that reads the PIPELINE could block a merge, and the
      # gap had a measured cost: on 16 Aug alone, FOUR content files were committed without the
      # Stage 7 note that certifies them, and TWO of those reached `main`. Every one was caught by a
      # human running the pre-flight, or by `health.yml` after the push - i.e. after the merge that
      # introduced it. `check-pipeline` section 4 is the check in question, and it lives inside
      # `system-health`, which ran nowhere near a pull request.
      #
      # Runs AFTER the build on purpose: `check-og-cards` reads `dist/`, and several of the other
      # sub-checks read the built output rather than the source.
      #
      # --strict is what makes this a gate rather than a report. Without it `system-health` ALWAYS
      # exits 0 - correct for the pre-flight, where a session reads the scorecard and decides, and
      # wrong here, because wiring an always-zero script into a workflow produces a gate that
      # silently cannot fail. It escalates FAILs only and ignores warnings, matching check-claims
      # and check-positions above; there are ~40 warnings today, all real work rather than defects,
      # and a gate that reddened on them would be switched off within a week.
      #
      # Verified in BOTH directions before wiring, on the same principle the strict block above
      # records: with a deliberate dangling reference present, `--strict` exits 1 while the plain
      # run still exits 0; with the tree clean, both exit 0.
      #
      # Note this makes the job's `fetch-depth: 0` above a hard requirement, not an optimisation.
      - name: System health
        run: node scripts/system-health.mjs --strict

      # IMPORTANT: the npm package literally named "lhci" is an unrelated, unofficial
      # package (it just prints a greeting) - a trap discovered while wiring this job up.
      # The real Lighthouse CI package is "@lhci/cli". Pinned so a new lhci release can't
      # silently change what this gate asserts.
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./.lighthouserc.json

      # Same job as the performance gate (mistakes-log M2): a cheap grep-style check over
      # src/content/**/*.mdx for an em dash or "comprehensive" in prose, excepting labels
      # and data (see scripts/prose-lint.mjs's ALLOWLIST).
      - name: Prose lint
        run: node scripts/prose-lint.mjs

      # ADDED 15 Aug 2026, closing a demand item filed on 10 Aug whose whole content was that this
      # check "runs only when someone remembers".
      #
      # It needs a browser, and that is the reason it is here rather than in postbuild alongside the
      # other three: a chromium download and a per-page render would be paid on every local build,
      # and check-reflow SKIPS (exit 0, printing the install command) when the browser is missing -
      # so wiring it to postbuild would have produced a check that silently does nothing on most
      # machines while appearing in the build log. CI is the one place the browser is guaranteed,
      # which turns the skip contract from a hole into what it was designed for.
      #
      # `playwright` is already a devDependency, so `npm ci` installs the driver; only the browser
      # binary has to be fetched, and only chromium is used.
      - name: Rendered layout (reflow + CPL)
        run: |
          npx playwright install --with-deps chromium
          node scripts/check-reflow.mjs
